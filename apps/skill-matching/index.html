<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生×企業スキルマッチングサービス | 伊澤 響 制作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --border: #e2e8f0;
      --accent: #4f46e5;
      --accent-cyan: #0284c7;
      --accent-green: #059669;
      --text: #0f172a;
      --text-sub: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      margin-bottom: 30px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      text-decoration: none;
    }

    .logo span { color: var(--accent); }

    .back-link {
      font-size: 0.88rem;
      color: var(--text-sub);
      text-decoration: none;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); }

    .grid-layout {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 24px;
    }

    @media (max-width: 800px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skill-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .skill-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    .skill-label.checked {
      background: rgba(79, 70, 229, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .job-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .job-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .job-company { font-size: 0.8rem; color: var(--accent); font-weight: 700; }
    .job-title { font-size: 1.1rem; font-weight: 700; }

    .match-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(5, 150, 105, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(5, 150, 105, 0.3);
    }

    .match-badge.rank-a { background: rgba(2, 132, 199, 0.12); color: var(--accent-cyan); border-color: rgba(2, 132, 199, 0.3); }
    .match-badge.rank-b { background: rgba(100, 116, 139, 0.12); color: var(--text-sub); border-color: var(--border); }

    .job-req-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }

    .tag-req {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-sub);
    }

    .tag-req.matched {
      background: rgba(79, 70, 229, 0.1);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-apply {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 0.88rem;
      margin-top: 8px;
    }
    .btn-apply:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="#" class="logo">学生×企業スキルマッチング <span>(Skill Matcher)</span></a>
      <a href="../../index.html" class="back-link">← ポートフォリオに戻る</a>
    </div>
  </header>

  <main class="container">
    <div style="margin-bottom: 24px;">
      <h2 style="font-size: 1.6rem; margin-bottom: 4px;">学生スキルと企業求人の適合度判定プラットフォーム</h2>
      <p style="color: var(--text-sub); font-size: 0.92rem;">制作：高度専門士情報技術科 3年 伊澤 響</p>
    </div>

    <div class="grid-layout">
      <!-- Student Profile Card -->
      <div class="card">
        <div class="card-title">👤 学生プロフィール ＆ スキル選択</div>
        
        <div style="margin-bottom: 16px;">
          <div style="font-size: 0.85rem; color: var(--text-sub);">氏名 / 学科</div>
          <div style="font-weight: 700; font-size: 1.1rem;">伊澤 響</div>
          <div style="font-size: 0.88rem; color: var(--accent);">高度専門士情報技術科 3年</div>
        </div>

        <div style="margin-bottom: 12px; font-size: 0.88rem; font-weight: 700;">■ 修得・学習中のスキル（チェックで適合度を計算）</div>
        <div class="skill-checkboxes" id="skill-selector">
          <!-- Checkboxes via JS -->
        </div>

        <div style="background: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid var(--border);">
          <div style="font-size: 0.8rem; color: var(--text-sub);">希望職種</div>
          <div style="font-weight: 600; font-size: 0.95rem;">Webフロントエンド / フルスタックエンジニア</div>
        </div>
      </div>

      <!-- Job Matching List -->
      <div class="card">
        <div class="card-title">🏢 企業求人一覧 ＆ マッチング結果</div>
        <div id="job-list-container">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>
  </main>

  <script>
    const allSkills = ["HTML/CSS", "JavaScript", "React", "TypeScript", "Node.js", "Express", "MySQL", "Git", "Python", "Vercel"];
    let studentSkills = ["HTML/CSS", "JavaScript", "React", "TypeScript", "Node.js", "Express", "MySQL", "Git", "Vercel"];

    const companyJobs = [
      {
        id: 1,
        company: "株式会社WebTech Solutions",
        title: "[自社開発] フロントエンドエンジニア募集",
        reqSkills: ["React", "TypeScript", "HTML/CSS", "Git", "Vercel"],
        description: "自社SaaSのフロントエンド開発・UI機能実装を担当していただきます。"
      },
      {
        id: 2,
        company: "システム・ラボ JAPAN",
        title: "[就職直結インターン] フルスタック開発プロジェクト",
        reqSkills: ["React", "Node.js", "Express", "MySQL", "TypeScript"],
        description: "Node.js/ExpressとMySQLを用いたバックエンド連携までトータルで担当。"
      },
      {
        id: 3,
        company: "データイノベーション株式会社",
        title: "バックエンド ＆ データベース設計エンジニア",
        reqSkills: ["Node.js", "Express", "MySQL", "Python", "Git"],
        description: "データベース設計や効率的なAPI構築に強みを持つ方を募集しています。"
      }
    ];

    const skillSelector = document.getElementById('skill-selector');
    const jobContainer = document.getElementById('job-list-container');

    function renderSkillSelector() {
      skillSelector.innerHTML = '';
      allSkills.forEach(skill => {
        const isChecked = studentSkills.includes(skill);
        const label = document.createElement('label');
        label.className = `skill-label ${isChecked ? 'checked' : ''}`;
        label.innerHTML = `
          <input type="checkbox" value="${skill}" ${isChecked ? 'checked' : ''} style="display:none;" onchange="toggleSkill('${skill}')">
          <span>${isChecked ? '✓' : '+'} ${skill}</span>
        `;
        skillSelector.appendChild(label);
      });
    }

    window.toggleSkill = function(skill) {
      if (studentSkills.includes(skill)) {
        studentSkills = studentSkills.filter(s => s !== skill);
      } else {
        studentSkills.push(skill);
      }
      renderSkillSelector();
      renderMatchingJobs();
    };

    function renderMatchingJobs() {
      jobContainer.innerHTML = '';

      companyJobs.forEach(job => {
        const matched = job.reqSkills.filter(s => studentSkills.includes(s));
        const matchPercent = Math.round((matched.length / job.reqSkills.length) * 100);

        let rankClass = 'rank-b';
        let rankText = `適性スコア: ${matchPercent}% (Rank B)`;
        if (matchPercent >= 80) { rankClass = ''; rankText = `適合度: ${matchPercent}% (Rank S - 高適性)`; }
        else if (matchPercent >= 60) { rankClass = 'rank-a'; rankText = `適合度: ${matchPercent}% (Rank A)`; }

        const jobCard = document.createElement('div');
        jobCard.className = 'job-item';
        jobCard.innerHTML = `
          <div class="job-header">
            <div>
              <div class="job-company">${job.company}</div>
              <div class="job-title">${job.title}</div>
            </div>
            <span class="match-badge ${rankClass}">${rankText}</span>
          </div>

          <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px;">${job.description}</p>

          <div class="job-req-tags">
            ${job.reqSkills.map(s => {
              const isMatch = studentSkills.includes(s);
              return `<span class="tag-req ${isMatch ? 'matched' : ''}">${isMatch ? '✓' : ''} ${s}</span>`;
            }).join('')}
          </div>

          <button class="btn-apply" onclick="applyJob('${job.company}')">
            スカウトオファー要求 / メッセージ送信
          </button>
        `;
        jobContainer.appendChild(jobCard);
      });
    }

    window.applyJob = function(company) {
      alert(`【送信完了】\n${company} へスキル情報および面談希望メッセージを送信しました！`);
    };

    renderSkillSelector();
    renderMatchingJobs();
  </script>
</body>
</html>
